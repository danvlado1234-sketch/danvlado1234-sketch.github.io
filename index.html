<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיעורי הרה"ג רבי יצחק ולדומירסקי שליט"א</title>
<meta name="description" content="שיעורי תורה מפי הרה&quot;ג רבי יצחק ולדומירסקי שליט&quot;א — שיעורי משנה יומיים לפי סדר, מסכת, פרק ומשנה.">
<meta name="theme-color" content="#140c07">
<meta property="og:site_name" content='שיעורי הרה"ג רבי יצחק ולדומירסקי שליט"א'>
<meta property="og:title" content='שיעורי הרה"ג רבי יצחק ולדומירסקי שליט"א'>
<meta property="og:description" content="שיעורי תורה — שיעורי משנה יומיים ועוד.">
<meta property="og:url" content="https://danvlado1234-sketch.github.io/">
<meta property="og:image" content="https://danvlado1234-sketch.github.io/library.jpg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "שיעורי הרה\"ג רבי יצחק ולדומירסקי שליט\"א",
  "alternateName": ["שיעורי הרב ולדומירסקי", "שיעורי משנה", "שיעורי משנה ולדומירסקי"],
  "url": "https://danvlado1234-sketch.github.io/"
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#f5ead0; --cream-dim:rgba(245,234,208,.72);
    --brass:#d4ae5a; --brass-deep:#9c7a35;
    --wine:#6d2733; --ink:#140c07;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Frank Ruhl Libre',serif; color:var(--cream);
    background:var(--ink); overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---- הספרייה: תמונה עם תנועת מצלמה איטית ---- */
  .bg {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:40% center;
    animation: kenburns 60s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform:scale(1.06) translateX(0); }
    to   { transform:scale(1.14) translateX(-2%); }
  }
  /* שכבת תאורה: צד התוכן (ימין) כהה, הספרייה והסטנדר (שמאל) נשארים מוארים */
  .glow {
    position:fixed; inset:0;
    background:
      linear-gradient(to left, rgba(14,8,4,.94) 0%, rgba(14,8,4,.82) 30%, rgba(14,8,4,.35) 58%, rgba(14,8,4,.05) 80%),
      linear-gradient(to top, rgba(14,8,4,.7) 0%, transparent 35%),
      radial-gradient(ellipse 60% 50% at 18% 70%, rgba(255,190,110,.10), transparent 70%);
  }
  .glow::after { /* ויניֶטה עדינה */
    content:""; position:absolute; inset:0;
    box-shadow:inset 0 0 180px rgba(0,0,0,.55);
  }

  /* ---- תוכן ---- */
  main {
    position:relative; z-index:2; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:clamp(22px, 5vw, 64px) clamp(20px, 6vw, 88px);
  }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .bsd { font-size:14px; color:var(--brass); letter-spacing:.04em; }

  .hero {
    margin-block:auto; max-width:620px;
    padding-block:clamp(28px, 6vh, 56px);
  }

  .eyebrow {
    display:flex; align-items:center; gap:14px;
    font-size:clamp(15px, 3.6vw, 19px); font-weight:500;
    letter-spacing:.34em; color:var(--brass);
  }
  .eyebrow::before, .eyebrow::after {
    content:""; height:1px; flex:0 0 clamp(28px, 6vw, 48px);
    background:linear-gradient(to left, var(--brass), transparent);
  }
  .eyebrow::after { background:linear-gradient(to right, var(--brass), transparent); }

  h1 {
    margin-top:14px; line-height:1.12;
    font-size:clamp(36px, 8.2vw, 68px); font-weight:900;
    text-shadow:0 2px 24px rgba(0,0,0,.7);
  }
  h1 .title { display:block; font-size:.5em; font-weight:500; color:var(--cream-dim); margin-bottom:.15em; }
  h1 .suffix { color:var(--brass); font-weight:700; }

  .tagline {
    margin-top:18px; max-width:30em;
    font-family:'Heebo',sans-serif; font-size:clamp(15px, 3.8vw, 17px);
    line-height:1.7; color:var(--cream-dim);
  }

  .ornament { margin:clamp(24px, 4.5vh, 36px) 0; width:180px; height:14px; color:var(--brass); opacity:.85; }

  /* ---- כרטיסי כניסה ---- */
  .menu { display:grid; gap:14px; max-width:520px; }
  .menu a {
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:18px;
    padding:18px 20px 18px 22px;
    text-decoration:none; color:var(--cream);
    background:linear-gradient(135deg, rgba(38,22,14,.72), rgba(24,14,9,.62));
    border:1px solid rgba(212,174,90,.38); border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,235,190,.08);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    transition:transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s, background .35s, box-shadow .35s;
  }
  .menu a::before { /* ברק זהב שחולף במעבר עכבר */
    content:""; position:absolute; inset:0;
    background:linear-gradient(100deg, transparent 30%, rgba(255,220,150,.13) 50%, transparent 70%);
    transform:translateX(120%); transition:transform .8s ease;
  }
  .menu a:hover, .menu a:focus-visible {
    transform:translateY(-3px);
    border-color:var(--brass);
    background:linear-gradient(135deg, rgba(109,39,51,.82), rgba(62,22,30,.78));
    box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(212,174,90,.25), inset 0 1px 0 rgba(255,235,190,.12);
  }
  .menu a:hover::before { transform:translateX(-120%); }
  .menu a:focus-visible { outline:2px solid var(--brass); outline-offset:3px; }

  .icon {
    flex:none; width:54px; height:54px; border-radius:50%;
    display:grid; place-items:center; color:var(--brass);
    background:radial-gradient(circle at 35% 30%, rgba(212,174,90,.22), rgba(212,174,90,.06));
    border:1px solid rgba(212,174,90,.45);
  }
  .icon svg { width:26px; height:26px; }
  .label { flex:1; min-width:0; }
  .label strong { display:block; font-size:clamp(20px, 5vw, 23px); font-weight:700; line-height:1.25; }
  .label small {
    display:block; margin-top:3px;
    font-family:'Heebo',sans-serif; font-size:14px; color:var(--cream-dim);
  }
  .arrow {
    flex:none; width:22px; height:22px; color:var(--brass);
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
  }
  .menu a:hover .arrow { transform:translateX(-5px); }

  footer {
    font-family:'Heebo',sans-serif; font-size:13px; color:rgba(245,234,208,.5);
    letter-spacing:.02em;
  }

  /* ---- כניסה מדורגת ---- */
  .rise { opacity:0; transform:translateY(16px); animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay:.15s } .d2 { animation-delay:.3s } .d3 { animation-delay:.45s }
  .d4 { animation-delay:.6s } .d5 { animation-delay:.75s } .d6 { animation-delay:.9s }
  @keyframes rise { to { opacity:1; transform:none; } }

  /* ---- מובייל: התוכן בתחתית, ההדגשה מלמטה ---- */
  @media (max-width: 760px) {
    .bg { object-position:62% center; }
    .glow {
      background:
        linear-gradient(to top, rgba(14,8,4,.97) 0%, rgba(14,8,4,.9) 42%, rgba(14,8,4,.45) 68%, rgba(14,8,4,.15) 100%);
    }
    .hero { margin-top:auto; margin-bottom:8px; padding-bottom:20px; }
    .menu a { padding:15px 16px; gap:14px; }
    .icon { width:46px; height:46px; }
    .icon svg { width:22px; height:22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bg { animation:none; }
    .rise { animation:none; opacity:1; transform:none; }
    .menu a, .menu a::before, .arrow { transition:none; }
  }
</style>
</head>
<body>
<img class="bg" src="library.jpg" alt="" aria-hidden="true">
<div class="glow" aria-hidden="true"></div>
<main>
  <div class="top rise">
    <p class="bsd">בס"ד</p>
  </div>

  <section class="hero">
    <p class="eyebrow rise d1">שיעורי תורה</p>
    <h1 class="rise d2">
      <span class="title">מפי הרה"ג</span>
      רבי יצחק ולדומירסקי <span class="suffix">שליט"א</span>
    </h1>
    <p class="tagline rise d3">שיעורים מוקלטים לשמיעה בכל עת ובכל מקום — משנה יומית לפי הסדר, ופרשת השבוע ומועדי השנה.</p>

    <svg class="ornament rise d4" viewBox="0 0 180 14" fill="none" aria-hidden="true">
      <path d="M0 7h72M108 7h72" stroke="currentColor" stroke-width="1"/>
      <path d="M90 1l6 6-6 6-6-6z" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="78" cy="7" r="1.6" fill="currentColor"/><circle cx="102" cy="7" r="1.6" fill="currentColor"/>
    </svg>

    <nav class="menu" aria-label="בחירת שיעורים">
      <a class="rise d5" href="https://danvlado1234-sketch.github.io/Shiurim-mishnhyot/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 6.5C10 5 7.5 4.5 4 4.5v13c3.5 0 6 .5 8 2 2-1.5 4.5-2 8-2v-13c-3.5 0-6 .5-8 2z"/><path d="M12 6.5v13"/>
          </svg>
        </span>
        <span class="label">
          <strong>שיעורי משנה</strong>
          <small>לפי סדר, מסכת, פרק ומשנה</small>
        </span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <a class="rise d6" href="https://danvlado1234-sketch.github.io/shiurim-parasha/">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c1.6 1.8 2.2 3.1 2.2 4.1A2.2 2.2 0 0 1 12 9.3a2.2 2.2 0 0 1-2.2-2.2C9.8 6.1 10.4 4.8 12 3z"/>
            <path d="M12 9.3V12"/><rect x="9.5" y="12" width="5" height="8" rx=".6"/><path d="M6.5 21h11"/>
          </svg>
        </span>
        <span class="label">
          <strong>פרשת שבוע ומועדים</strong>
          <small>שיעורים על הפרשה ועל מועדי השנה</small>
        </span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
    </nav>
  </section>

  <footer class="rise d6">והגית בו יומם ולילה · יהושע א, ח</footer>
</main>
</body>
</html>
