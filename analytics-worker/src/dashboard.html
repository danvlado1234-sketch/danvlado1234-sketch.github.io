<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>סטטיסטיקות · שיעורי הרב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0d; --panel: #191816; --panel2: #221f1d; --panel3: #2a2724; --line: #2e2a27; --line2: #3a3531;
    --text: #f4efe8; --muted: #b0a698; --dim: #7a7166;
    --gold: #d9a441; --gold2: #f0c674; --gold-ink: #1a1408; --green: #6cc98b; --red: #ec7b6e; --blue: #6aa7e0;
    /* צבע לכל סוג שיעור — קבוע, לא לפי דירוג */
    --k-mishna: #b98422; --k-parasha: #3f86c8; --k-moed: #3a9a5c; --k-iyun: #a06ad0; --k-other: #6f675e;
    --r: 18px; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; color: var(--text); font: 14px/1.5 Rubik, system-ui, sans-serif; }
  body { background: radial-gradient(1100px 520px at 85% -120px, rgba(217,164,65,.13), transparent 70%), radial-gradient(900px 500px at -10% 10%, rgba(63,134,200,.07), transparent 70%), var(--bg); background-attachment: fixed; min-height: 100vh; }
  a { color: var(--gold2); }
  button, input, select { font: inherit; color: inherit; }
  .num, .v, .hv { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 22px 22px 70px; }

  /* כותרת */
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 18px; }
  .brand { font-family: 'Frank Ruhl Libre', serif; font-size: 30px; font-weight: 900; line-height: 1.05; }
  .brand small { display: block; font: 500 12.5px Rubik, sans-serif; color: var(--muted); margin-top: 4px; }
  .spacer { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .chip { background: transparent; border: 0; border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; color: var(--muted); transition: background .15s, color .15s; }
  .chip:hover { color: var(--text); background: var(--panel2); }
  .chip.on { background: var(--gold); color: var(--gold-ink); font-weight: 600; }
  .range-custom { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .range-custom input { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; color-scheme: dark; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 14px; cursor: pointer; transition: border-color .15s; }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); font-weight: 600; }
  .btn.danger { border-color: #6a2f2a; color: #f2a59c; }

  /* עכשיו באתר */
  .live { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; background: linear-gradient(100deg, rgba(108,201,139,.10), rgba(25,24,22,.9) 45%); border: 1px solid var(--line);
          border-radius: var(--r); padding: 12px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); display: inline-block; box-shadow: 0 0 0 0 rgba(108,201,139,.6); animation: pulse 2s infinite; margin-inline-end: 8px; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(108,201,139,0); } 100% { box-shadow: 0 0 0 0 rgba(108,201,139,0); } }
  .live b { font-size: 20px; margin-inline-start: 4px; }
  .live .now-list { color: var(--muted); font-size: 13px; flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .now-pill { background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

  /* מדדים */
  .hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 12px; }
  @media (max-width: 1000px) { .hero { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .hk { padding: 12px 12px 0; } .hk .hv { font-size: 28px; } .hk svg { width: calc(100% + 24px); margin: 6px -12px 0; height: 40px; } .hk .d { font-size: 11.5px; } }
  @media (max-width: 340px) { .hero { grid-template-columns: 1fr; } }
  .hk { position: relative; overflow: hidden; background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 0; box-shadow: var(--shadow); }
  .hk .l { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .hk .hv { font-size: 38px; font-weight: 700; line-height: 1.15; margin-top: 4px; letter-spacing: -.5px; }
  .hk .hv small { font-size: 15px; font-weight: 500; color: var(--muted); margin-inline-start: 6px; letter-spacing: 0; }
  .hk .d { font-size: 12.5px; color: var(--dim); min-height: 1.5em; }
  .hk svg { display: block; width: calc(100% + 36px); margin: 8px -18px 0; height: 54px; }
  .badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; background: var(--panel3); color: var(--muted); white-space: nowrap; }
  .badge.up { background: rgba(108,201,139,.14); color: var(--green); } .badge.down { background: rgba(236,123,110,.14); color: var(--red); }
  .minor { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .mk { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; }
  .mk .l { color: var(--dim); font-size: 12px; }
  .mk .v { font-size: 18px; font-weight: 600; }
  .mk .d { font-size: 11.5px; color: var(--dim); }

  /* לשוניות */
  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 16px; border-bottom: 1px solid var(--line); }
  nav.tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.on { color: var(--text); border-color: var(--gold); }

  /* כרטיסים */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; grid-column: span 6; box-shadow: var(--shadow); }
  .card.w12 { grid-column: span 12; } .card.w4 { grid-column: span 4; } .card.w8 { grid-column: span 8; } .card.w3 { grid-column: span 3; } .card.w5 { grid-column: span 5; } .card.w7 { grid-column: span 7; }
  @media (max-width: 1000px) { .card, .card.w4, .card.w8, .card.w3, .card.w5, .card.w7 { grid-column: span 12; } }
  .card h3 { margin: 0 0 12px; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .card h3 .sub { color: var(--dim); font-weight: 400; font-size: 12.5px; }
  .card h3 .right { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 4px; }
  .card h3 .chip { padding: 3px 10px; font-size: 12px; background: var(--panel2); }
  .card h3 .chip.on { background: var(--gold); }
  .note { color: var(--dim); font-size: 12.5px; }
  .empty { color: var(--dim); padding: 22px 0; text-align: center; }

  /* פסים אופקיים */
  .hbars { display: flex; flex-direction: column; gap: 7px; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 36%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; padding: 2px 4px; border-radius: 8px; }
  .hbar:hover { background: var(--panel2); }
  .hbar .k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .bar { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .hbar .bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
  .hbar .n { color: var(--muted); direction: ltr; min-width: 60px; text-align: left; font-variant-numeric: tabular-nums; }

  /* גרף שטח */
  .area { position: relative; }
  .area svg { width: 100%; height: 280px; display: block; overflow: visible; }
  .area .grid-l { stroke: var(--line); stroke-width: 1; }
  .area .ax { fill: var(--dim); font-size: 11px; font-family: Rubik, sans-serif; }
  .area .ln { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .area .pt { fill: var(--gold); stroke: var(--panel); stroke-width: 2; }
  .area .sat { fill: rgba(255,255,255,.025); }

  /* תובנות */
  .ins { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ins li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; background: var(--panel2); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.55; }
  .ins .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(217,164,65,.14); font-size: 17px; }
  .ins b { color: var(--gold2); font-weight: 600; }

  /* מובילים */
  .lb { display: flex; flex-direction: column; gap: 4px; }
  .lb .row { display: grid; grid-template-columns: 28px 1fr 64px 120px; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 12px; }
  .lb .row:hover { background: var(--panel2); }
  .lb .rk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--panel3); color: var(--muted); }
  .lb .row:nth-child(1) .rk { background: linear-gradient(140deg, #f0c674, #b98422); color: var(--gold-ink); }
  .lb .row:nth-child(2) .rk { background: linear-gradient(140deg, #e3e0da, #9c978f); color: #1c1b19; }
  .lb .row:nth-child(3) .rk { background: linear-gradient(140deg, #d9a07a, #8a5a3a); color: #1c1410; }
  .lb .t { min-width: 0; }
  .lb .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .t span { font-size: 12px; color: var(--dim); }
  .lb .pn { text-align: left; direction: ltr; font-weight: 600; font-size: 16px; }
  .lb .pn small { display: block; font-size: 11px; color: var(--dim); font-weight: 400; }
  .reach { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--dim); }
  .reach .track { height: 6px; background: var(--panel3); border-radius: 3px; overflow: hidden; }
  .reach .track i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  @media (max-width: 560px) { .lb .row { grid-template-columns: 28px 1fr 56px; } .lb .reach { display: none; } }
  .kdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 5px; vertical-align: 0; }

  /* חלוקה לפי סוג (פס מחולק) */
  .seg { display: flex; height: 22px; border-radius: 8px; overflow: hidden; gap: 2px; margin: 4px 0 14px; }
  .seg i { display: block; height: 100%; min-width: 3px; }
  .seg i:first-child { border-radius: 0 8px 8px 0; } .seg i:last-child { border-radius: 8px 0 0 8px; }
  .klist { display: flex; flex-direction: column; gap: 8px; }
  .klist div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; font-size: 13.5px; }
  .klist .pc { color: var(--muted); direction: ltr; font-variant-numeric: tabular-nums; min-width: 40px; text-align: left; }
  .klist .hv { font-weight: 600; direction: ltr; font-variant-numeric: tabular-nums; }

  /* מפת חום */
  .heatwrap { overflow-x: auto; scrollbar-width: thin; }
  .heat { display: grid; grid-template-columns: 50px repeat(24, minmax(0, 1fr)); min-width: 520px; gap: 3px; font-size: 11px; direction: rtl; }
  .heat .c { aspect-ratio: 1.25; border-radius: 4px; background: var(--panel2); transition: transform .1s; }
  .heat .c:hover { transform: scale(1.18); outline: 1px solid var(--gold2); }
  .heat .h { color: var(--dim); text-align: center; }
  .heat .d { color: var(--muted); display: flex; align-items: center; }
  .scale { display: flex; align-items: center; gap: 8px; justify-content: flex-end; font-size: 11.5px; color: var(--dim); margin-top: 10px; }
  .scale i { width: 120px; height: 8px; border-radius: 4px; background: linear-gradient(270deg, rgba(217,164,65,.12), rgba(217,164,65,1)); }

  /* טבלאות */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; user-select: none; position: sticky; top: 0; background: var(--panel); }
  th.sorted::after { content: ' ▾'; color: var(--gold); }
  th.sorted.asc::after { content: ' ▴'; }
  td.num { direction: ltr; text-align: left; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel2); }
  .scroll { max-height: 580px; overflow: auto; }
  .pill { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .pill.g { color: var(--green); border-color: #2c4a36; } .pill.y { color: var(--gold2); border-color: #4a3d22; }
  .progress { height: 6px; background: var(--panel3); border-radius: 3px; overflow: hidden; min-width: 70px; }
  .progress i { display: block; height: 100%; background: var(--green); }
  .split { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--panel2); margin: 6px 0 8px; gap: 2px; }
  .split i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-inline-end: 5px; vertical-align: -1px; }

  /* חלונית ריחוף */
  #tip { position: fixed; z-index: 50; pointer-events: none; background: rgba(34,31,29,.97); border: 1px solid var(--line2); border-radius: 12px; padding: 8px 11px; font-size: 12.5px; line-height: 1.5;
         box-shadow: 0 10px 30px -10px rgba(0,0,0,.8); max-width: 280px; white-space: pre-line; opacity: 0; transition: opacity .1s; }
  #tip.on { opacity: 1; }
  #tip b { color: var(--gold2); }

  /* כניסה */
  #login { min-height: 100vh; display: grid; place-items: center; }
  #login form { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 30px; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
  #login input[type=password] { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  #login .err { color: var(--red); min-height: 1.2em; font-size: 13px; }
  .loading { opacity: .5; pointer-events: none; transition: opacity .2s; }

  /* חלון פרטים */
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 20px; width: min(900px, 95vw); max-height: 88vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.65); backdrop-filter: blur(2px); }
  dialog .dh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  dialog .db { padding: 14px 18px; }
  dialog h3 { font-size: 15px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 70px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .tl time { color: var(--dim); direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px 16px; margin-bottom: 14px; font-size: 13px; }
  .facts div span { display: block; color: var(--dim); font-size: 12px; }
  .exports { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .exports .card { grid-column: auto; }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; direction: ltr; display: inline-block; }
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginForm">
    <div class="brand">סטטיסטיקות<small>שיעורי הרה"ג רבי יצחק ולדומירסקי שליט"א</small></div>
    <input type="password" id="pw" placeholder="סיסמה" autocomplete="current-password" required>
    <span class="note">הכניסה נשמרת בלשונית הזאת בלבד.</span>
    <button class="btn primary" type="submit">כניסה</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div class="brand">סטטיסטיקות<small>שיעורי הרב · האתר והאפליקציה</small></div>
    <div class="spacer"></div>
    <div class="chips" id="ranges">
      <button class="chip" data-r="today">היום</button>
      <button class="chip" data-r="yesterday">אתמול</button>
      <button class="chip on" data-r="7">7 ימים</button>
      <button class="chip" data-r="30">30 יום</button>
      <button class="chip" data-r="90">3 חודשים</button>
      <button class="chip" data-r="365">שנה</button>
      <button class="chip" data-r="all">הכל</button>
    </div>
    <div class="range-custom"><input type="date" id="from"> עד <input type="date" id="to"></div>
    <button class="btn" id="refresh" title="רענון">↻ רענון</button>
    <button class="btn" id="logout">יציאה</button>
  </header>

  <section class="live" id="live"><span><span class="dot"></span>טוען…</span></section>
  <section id="kpis"></section>

  <nav class="tabs" id="tabs">
    <button class="on" data-tab="overview">סקירה</button>
    <button data-tab="lessons">שיעורים והאזנה</button>
    <button data-tab="times">זמני כניסה</button>
    <button data-tab="audience">קהל ומכשירים</button>
    <button data-tab="sources">מקורות, דפים וחיפושים</button>
    <button data-tab="sessions">ביקורים</button>
    <button data-tab="export">ייצוא נתונים</button>
  </nav>

  <main id="main"></main>
</div>
</div>

<div id="tip" role="tooltip"></div>
<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><span class="spacer"></span><button class="btn" id="dlgClose">סגירה</button></div><div class="db" id="dlgBody"></div></dialog>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = 'sa_dash_pw';
  // ניקוי שאריות גרסה ישנה ששמרה סיסמה ב-sessionStorage/localStorage
  try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch {}
  let AUTHED = false;

  // ---------- פורמטים ----------
  const TZ = 'Asia/Jerusalem';
  const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const todayIL = () => dayFmt.format(new Date());
  const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const N = n => (n == null || isNaN(n)) ? '0' : Math.round(n).toLocaleString('he-IL');
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const dur = s => {
    s = Math.round(s || 0);
    if (s < 60) return s + ' שנ׳';
    if (s < 3600) return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' דק׳';
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h + ':' + String(m).padStart(2, '0') + ' שע׳';
  };
  const hours = s => { const h = (s || 0) / 3600; return h >= 10 ? N(h) : h.toFixed(1); };
  const tFmt = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' });
  const timeFmt = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const fullFmt = new Intl.DateTimeFormat('he-IL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const shortDay = d => `${Number(d.slice(8))}.${Number(d.slice(5, 7))}`;

  // ---------- API ----------

  // ---------- חלונית ריחוף (לכל רכיב עם data-tip) ----------

  // התוכן של data-tip נבנה כ-HTML מאובטח (esc) ואז מקודד שוב לתוך המאפיין

  // ---------- טעינה ----------

  async function loadLive() {

  // ---------- רכיבי תצוגה ----------
  function change(cur, prev) {

    return (cur - prev) / prev * 100;
  }
  function badge(cur, prev, invert) {
    const ch = change(cur, prev);
    if (ch == null) return '';

    const good = invert ? ch < 0 : ch > 0;
    return `<span class="badge ${good ? 'up' : 'down'}" title="לעומת התקופה הקודמת באותו אורך">${ch > 0 ? '▲' : '▼'} ${Math.abs(ch).toFixed(0)}%</span>`;
  }

  function hbars(rows, { k = r => r.k, v = r => r.n, fmt = N, sub, limit = 15, color } = {}) {
    rows = rows.slice(0, limit);
    if (!rows.length) return '<div class="empty">אין נתונים בטווח הזה</div>';
    const max = Math.max(...rows.map(v), 1);
    return `<div class="hbars">${rows.map(r => `<div class="hbar"${tipAttr(`<b>${esc(k(r))}</b>\n${esc(fmt(v(r)))}${sub ? ' · ' + esc(sub(r)) : ''}`)}><span class="k">${esc(k(r))}</span><span class="bar"><i style="width:${(v(r) / max * 100).toFixed(1)}%${color ? ';background:' + color(r) : ''}"></i></span><span class="n">${fmt(v(r))}${sub ? ' · ' + sub(r) : ''}</span></div>`).join('')}</div>`;

  function dailySeries() {
    const S = Object.fromEntries(DATA.dailyS.map(r => [r.day, r]));
    const L = Object.fromEntries(DATA.dailyL.map(r => [r.day, r]));
    const out = [];
    let d = DATA.from, guard = 0;
    while (d <= DATA.to && guard++ < 2000) { out.push({ day: d, s: S[d] || {}, l: L[d] || {} }); d = addDays(d, 1); }
    let i = 0; while (i < out.length - 1 && !out[i].s.sessions && !out[i].l.plays) i++;
    return out.slice(i);
  }
  // סדרות ארוכות מקובצות לשבועות כדי שהגרף יישאר קריא
  function bucketed(rows) {
    if (rows.length <= 120) return { rows, unit: 'day' };
    const out = [];
    for (let i = 0; i < rows.length; i += 7) {
      const g = rows.slice(i, i + 7), sum = (f, k) => g.reduce((a, r) => a + (r[f][k] || 0), 0);
      out.push({ day: g[0].day, end: g[g.length - 1].day,
        s: { visitors: sum('s', 'visitors'), new_visitors: sum('s', 'new_visitors'), sessions: sum('s', 'sessions'), pageviews: sum('s', 'pageviews') },
        l: { plays: sum('l', 'plays'), listeners: sum('l', 'listeners'), listen_s: sum('l', 'listen_s'), completed: sum('l', 'completed') } });
    }
    return { rows: out, unit: 'week' };
  }

  let dailyMetric = 'listen';
  const METRICS = {
    listen: { name: 'שעות האזנה', get: r => (r.l.listen_s || 0) / 3600, fmt: v => v >= 10 ? N(v) : v.toFixed(1) },
    listeners: { name: 'מאזינים', get: r => r.l.listeners || 0, fmt: N },
    plays: { name: 'השמעות', get: r => r.l.plays || 0, fmt: N },
    visitors: { name: 'מבקרים', get: r => r.s.visitors || 0, fmt: N },
    new_visitors: { name: 'מבקרים חדשים', get: r => r.s.new_visitors || 0, fmt: N },

  };

  function niceTop(max) {
    if (max <= 0) return { top: 1, step: 1 };
    const p = Math.pow(10, Math.floor(Math.log10(max)));
    const step = [0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10].map(x => x * p).find(s => s * 4 >= max) || p;
    return { top: Math.ceil(max / step) * step, step };
  }
  let areaState = null;
  function areaChart() {
    const { rows, unit } = bucketed(dailySeries()), m = METRICS[dailyMetric];

    const W = 1000, H = 280, P = { t: 16, r: 10, b: 28, l: 44 };
    const vals = rows.map(m.get), { top, step } = niceTop(Math.max(...vals));
    const xw = (W - P.l - P.r) / Math.max(1, rows.length - 1);

    // שבתות ברקע (בתצוגה יומית)
    if (unit === 'day' && rows.length > 1) rows.forEach((r, i) => { if (new Date(r.day + 'T12:00:00Z').getUTCDay() === 6) g += `<rect class="sat" x="${(x(i) - xw / 2).toFixed(1)}" y="${P.t}" width="${xw.toFixed(1)}" height="${H - P.t - P.b}"/>`; });
    const pts = vals.map((v, i) => [x(i), y(v)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const areaPath = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${H - P.b} L${pts[0][0].toFixed(1)} ${H - P.b} Z`;
    const every = Math.ceil(rows.length / 12);
    rows.forEach((r, i) => { if (i % every === 0 || i === rows.length - 1) g += `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${shortDay(r.day)}</text>`; });
    areaState = { rows, vals, x, y, W, H, P, m, unit };
    return `<div class="area"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr" aria-label="${esc(m.name)} לאורך זמן">
      <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a441" stop-opacity=".45"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></linearGradient></defs>

    const move = e => {

      let i = 0, best = Infinity; rows.forEach((_, j) => { const d = Math.abs(x(j) - px); if (d < best) { best = d; i = j; } });

      showTip(`<b>${esc(when)}</b>\n${esc(m.name)}: ${esc(m.fmt(vals[i]))}\nמבקרים ${N(r.s.visitors)} · השמעות ${N(r.l.plays)}\nהאזנה ${esc(dur(r.l.listen_s))}`, b.left + cx / W * b.width, b.top + cy / areaState.H * b.height);

  function sparkline(vals) {
    if (vals.length < 2) return '<svg viewBox="0 0 100 54"></svg>';
    const max = Math.max(...vals, 1), W = 100, H = 54;
    const pts = vals.map((v, i) => [i / (vals.length - 1) * W, H - 4 - v / max * (H - 12)]);

      <path d="${line} L${W} ${H} L0 ${H} Z" fill="url(#sg)"/><path d="${line}" fill="none" stroke="#d9a441" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }

  function heatmap(rows, valKey = 'n', fmt = N) {

    let h = '<div class="heatwrap"><div class="heat"><span></span>';

      }

  function sumBy(rows, key, valKey = 'n') { const o = Object.create(null); for (const r of rows) o[r[key]] = (o[r[key]] || 0) + (r[valKey] || 0); return o; }

  // טבלה ממוינת
  function table(id, cols, rows, opts = {}) {
    const st = (table.state[id] ||= { key: opts.sort || cols.find(c => c.num)?.key, asc: false });
    const sorted = [...rows].sort((a, b) => {

    });

      <tbody>${sorted.map(r => `<tr${opts.click ? ` class="click" data-row="${rows.indexOf(r)}"` : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.fmt ? c.fmt(r) : esc(r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  // ---------- מדדים ----------
  function renderKpis() {
    const s = DATA.kpiS[0] || {}, l = DATA.kpiL[0] || {}, ps = DATA.prev.kpiS || {}, pl = DATA.prev.kpiL || {};
    const ret = DATA.returning[0]?.n || 0;
    const ev = Object.fromEntries(DATA.evTypes.map(r => [r.type, r]));
    const rows = dailySeries();
    const hk = (label, value, unit, cur, prev, series, sub, title) => `<div class="hk" title="${esc(title || '')}">
      <div class="l"><span>${label}</span>${badge(cur, prev)}</div>

    const mk = (l, v, d, title) => `<div class="mk" title="${esc(title || '')}"><div class="l">${l}</div><div class="v">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
    $('#kpis').innerHTML = `<div class="hero">
      ${hk('מאזינים', N(l.listeners), '', l.listeners, pl.listeners, rows.map(r => r.l.listeners || 0), `${pct(l.listeners, s.visitors)} מהמבקרים האזינו`, 'מכשירים שונים שהאזינו לפחות 3 שניות')}
      ${hk('שעות האזנה', hours(l.listen_s), 'שעות', l.listen_s, pl.listen_s, rows.map(r => r.l.listen_s || 0), `ממוצע ${dur(l.avg_listen)} להשמעה`, 'זמן מתוך תוכן השיעורים, ללא דילוגים')}
      ${hk('השמעות', N(l.plays), '', l.plays, pl.plays, rows.map(r => r.l.plays || 0), `${pct(l.completed, l.plays)} הגיעו לסוף · ${N(l.items)} שיעורים שונים`, 'השמעה = לפחות 3 שניות האזנה')}
      ${hk('מבקרים', N(s.visitors), '', s.visitors, ps.visitors, rows.map(r => r.s.visitors || 0), `${N(s.new_visitors)} חדשים · ${N(ret)} חוזרים`, 'מכשירים/דפדפנים שונים שנכנסו בטווח')}
    </div><div class="minor">
      ${mk('ביקורים', N(s.sessions), `${badge(s.sessions, ps.sessions)}`, 'הפסקה של 30 דקות מתחילה ביקור חדש')}
      ${mk('משך ביקור ממוצע', dur(s.avg_duration), '', 'מהכניסה ועד הפעולה האחרונה (כולל האזנה ברקע)')}
      ${mk('זמן פעיל ממוצע', dur(s.avg_active), `סה״כ ${hours(s.total_active)} שעות`, 'הזמן שהאתר היה גלוי על המסך')}
      ${mk('שעות האזנה בפועל', hours(l.wall_s), 'לפי מהירות ההשמעה', 'זמן שעון, תוך שקלול שינויי מהירות')}
      ${mk('שיעורים שהושלמו', N(l.completed), pct(l.completed, l.plays) + ' מההשמעות')}
      ${mk('צפיות בדפים', N(s.pageviews), `${s.sessions ? (s.pageviews / s.sessions).toFixed(1) : 0} לביקור`)}
      ${mk('נטישה מיידית', pct(s.bounces, s.sessions), 'פחות מ-30 שנ׳, בלי השמעה', 'ביקור קצר מ-30 שנ׳ בלי השמעה ובלי מעבר דף')}
      ${mk('הורדות', N(ev.download?.n), `סיכומים ${N(ev.pdf_open?.n)} · שיתופים ${N(ev.share?.n)}`)}
      ${mk('מהאפליקציה', pct(s.app_sessions, s.sessions), `התקנות חדשות: ${N(ev.app_installed?.n)}`)}
    </div>`;
  }

  // ---------- תובנות כתובות ----------
  function insights() {
    const s = DATA.kpiS[0] || {}, l = DATA.kpiL[0] || {}, pl = DATA.prev.kpiL || {}, ps = DATA.prev.kpiS || {};
    const out = [];
    const ch = change(l.listen_s, pl.listen_s);
    if (l.listen_s) out.push(['🎧', `<b>${N(l.listeners)}</b> מאזינים שמעו <b>${hours(l.listen_s)} שעות</b> שיעורים${ch != null && Math.abs(ch) >= 5 ? ` — ${ch > 0 ? 'עלייה' : 'ירידה'} של ${Math.abs(ch).toFixed(0)}% מהתקופה הקודמת` : ''}.`]);
    else if (s.visitors) out.push(['👀', `<b>${N(s.visitors)}</b> מבקרים נכנסו, אבל עוד לא הושמע שיעור בטווח הזה.`]);
    const top = DATA.topItems[0];
    if (top) out.push(['🏆', `השיעור המבוקש: <b>${esc(top.title || top.item_id)}</b> — ${N(top.plays)} השמעות, ${N(top.listeners)} מאזינים.`]);
    const byDow = sumBy(DATA.heatL, 'dow', 's'), byHour = sumBy(DATA.heatL, 'hour', 's');
    const pd = Object.entries(byDow).sort((a, b) => b[1] - a[1])[0], ph = Object.entries(byHour).sort((a, b) => b[1] - a[1])[0];
    if (pd && ph) out.push(['🕘', `מאזינים בעיקר ביום <b>${DAYS[pd[0]]}</b>, ובשעות <b>${String(ph[0]).padStart(2, '0')}:00–${String((+ph[0] + 1) % 24).padStart(2, '0')}:00</b>.`]);
    const kinds = DATA.kinds.filter(k => k.s > 0).sort((a, b) => b.s - a.s);
    const tot = kinds.reduce((a, k) => a + k.s, 0);
    if (kinds[0] && tot) out.push(['📚', `<b>${pct(kinds[0].s, tot)}</b> מזמן ההאזנה הוא ${esc(KIND[kinds[0].k] || 'אחר')}${kinds[1] ? `, ואחריו ${esc(KIND[kinds[1].k] || 'אחר')} (${pct(kinds[1].s, tot)})` : ''}.`]);
    if (l.plays) out.push(['✅', `<b>${pct(l.completed, l.plays)}</b> מההשמעות הגיעו לסוף השיעור; בממוצע שומעים <b>${dur(l.avg_listen)}</b> בכל השמעה.`]);
    const src = DATA.sources.filter(r => r.k).sort((a, b) => b.n - a.n)[0];
    if (src && s.sessions) out.push(['🔗', `המקור המוביל לכניסות: <b>${esc(srcName(src.k))}</b> (${pct(src.n, s.sessions)} מהביקורים).`]);
    const miss = DATA.searches.filter(r => !Math.round(r.results || 0)).slice(0, 3);
    if (miss.length) out.push(['🔍', `חיפשו ולא מצאו: ${miss.map(r => `<b>${esc(r.k)}</b>`).join(', ')}.`]);
    const nch = change(s.new_visitors, ps.new_visitors);
    if (s.new_visitors && nch != null && Math.abs(nch) >= 15) out.push(['✨', `${nch > 0 ? 'יותר' : 'פחות'} מבקרים חדשים מהרגיל: <b>${N(s.new_visitors)}</b> (${nch > 0 ? '+' : '−'}${Math.abs(nch).toFixed(0)}%).`]);
    if (!out.length) return '<div class="empty">אין עדיין מספיק נתונים בטווח הזה</div>';
    return `<ul class="ins">${out.slice(0, 6).map(([ic, t]) => `<li><span class="ic" aria-hidden="true">${ic}</span><span>${t}</span></li>`).join('')}</ul>`;
  }

  function leaderboard(n = 8) {
    const rows = DATA.topItems.slice(0, n);
    if (!rows.length) return '<div class="empty">לא הושמעו שיעורים בטווח הזה</div>';
    return `<div class="lb">${rows.map((r, i) => {
      const reach = Math.round((r.avg_reach || 0) * 100);
      return `<div class="row"${tipAttr(`<b>${esc(r.title || r.item_id)}</b>\n${N(r.plays)} השמעות · ${N(r.listeners)} מאזינים\nזמן האזנה ${esc(dur(r.listen_s))} · הושלמו ${N(r.completed)}`)}>
        <span class="rk">${i + 1}</span>
        <span class="t"><b>${esc(r.title || r.item_id)}</b><span><i class="kdot" style="background:${kColor(r.kind)}"></i>${esc(KIND[r.kind] || 'אחר')}${r.series ? ' · ' + esc(r.series) : ''} · ${esc(dur(r.listen_s))}</span></span>
        <span class="pn">${N(r.plays)}<small>השמעות</small></span>
        <span class="reach">הגיעו בממוצע עד ${reach}%<span class="track"><i style="width:${reach}%"></i></span></span></div>`;
    }).join('')}</div>`;
  }

  function kindsBlock() {
    const by = Object.fromEntries(DATA.kinds.map(r => [r.k, r]));
    const rows = [...KIND_ORDER, ...DATA.kinds.map(r => r.k).filter(k => !KIND_ORDER.includes(k))].map(k => ({ k, ...(by[k] || { s: 0, n: 0, u: 0 }) })).filter(r => r.s > 0 || r.n > 0);
    const tot = rows.reduce((a, r) => a + (r.s || 0), 0);
    if (!tot) return '<div class="empty">אין האזנה בטווח הזה</div>';
    return `<div class="seg">${rows.map(r => `<i style="flex:${r.s};background:${kColor(r.k)}"${tipAttr(`<b>${esc(KIND[r.k] || 'אחר')}</b>\n${esc(hours(r.s))} שעות · ${pct(r.s, tot)}\n${N(r.n)} השמעות · ${N(r.u)} מאזינים`)}></i>`).join('')}</div>
      <div class="klist">${rows.map(r => `<div><span><i class="kdot" style="background:${kColor(r.k)}"></i>${esc(KIND[r.k] || 'אחר')} <span class="note">· ${N(r.n)} השמעות</span></span><span class="hv">${hours(r.s)} שע׳</span><span class="pc">${pct(r.s, tot)}</span></div>`).join('')}</div>`;
  }

  // ---------- תצוגות ----------
  // טווח שחוצה שנה — עם השנה, כדי ש"23.11 – 22.11" לא ייראה כמו יום אחד

  function vOverview() {

    return `<div class="grid">

        <span class="right">${Object.entries(METRICS).map(([k, m]) => `<button class="chip${k === dailyMetric ? ' on' : ''}" data-metric="${k}">${m.name}</button>`).join('')}</span></h3>${areaChart()}</div>
      <div class="card w4"><h3>בקצרה</h3>${insights()}</div>
      <div class="card w8"><h3>השיעורים המובילים <span class="sub">לפי השמעות · הרשימה המלאה בלשונית "שיעורים והאזנה"</span></h3>${leaderboard(8)}</div>
      <div class="card w4"><h3>מה שומעים <span class="sub">זמן האזנה לפי סוג</span></h3>${kindsBlock()}

        <div class="split"><i style="width:${s.visitors ? (s.new_visitors / s.visitors * 100) : 0}%;background:var(--gold)"></i><i style="flex:1;background:var(--blue)"></i></div>
        <div class="legend"><span style="--c:var(--gold)">חדשים ${N(s.new_visitors)}</span><span style="--c:var(--blue)">חוזרים ${N(ret)}</span></div>
        <p class="note">מאז תחילת המדידה: <b>${N(DATA.allTime.visitors)}</b> מבקרים${DATA.allTime.since ? ` (מ-${esc(DATA.allTime.since)})` : ''}</p></div>
      <div class="card w8"><h3>מתי מאזינים <span class="sub">זמן האזנה לפי יום ושעה · שעון ישראל</span></h3>${heatmap(DATA.heatL, 's', v => dur(v))}</div>
      <div class="card w4"><h3>מאיפה מגיעים</h3>${hbars(DATA.sources, { k: r => srcName(r.k), limit: 6, sub: r => pct(r.n, s.sessions) })}
        <h3 style="margin-top:22px">באיזה מכשיר</h3>${hbars(DATA.devices.map(r => ({ ...r, k: DEVICE[r.k] || r.k || 'לא ידוע' })), { sub: r => pct(r.n, s.sessions) })}</div>
    </div>`;
  }

  function vLessons() {
    const l = DATA.kpiL[0] || {};
    const actions = Object.create(null);
    for (const a of DATA.actions) { const o = (actions[a.item_id] ||= { item_id: a.item_id, title: a.title }); o[a.type] = a.n; }
    const items = DATA.topItems.map(r => ({ ...r, ...(actions[r.item_id] || {}), reach: r.avg_reach || 0 }));
    const reachRows = Array.from({ length: 11 }, (_, b) => ({ k: b === 10 ? '100%' : `${b * 10}–${b * 10 + 9}%`, n: (DATA.reach.find(x => x.b === b) || {}).n || 0 }));
    const actRows = Object.values(actions).map(a => ({ ...a, title: a.title || a.item_id }));
    return `<div class="grid">
      <div class="card w12"><h3>כל השיעורים שהושמעו <span class="sub">לחיצה על כותרת עמודה ממיינת · "הגיעו עד" = ממוצע הנקודה הרחוקה ביותר בשיעור</span></h3>
        ${table('items', [
          { key: 'title', name: 'שיעור', fmt: r => `${esc(r.title || r.item_id)}<br><span class="pill"><i class="kdot" style="background:${kColor(r.kind)}"></i>${esc(KIND[r.kind] || r.kind || '')}</span>` },
          { key: 'plays', name: 'השמעות', num: 1, fmt: r => N(r.plays) },
          { key: 'listeners', name: 'מאזינים', num: 1, fmt: r => N(r.listeners) },
          { key: 'listen_s', name: 'זמן האזנה', num: 1, fmt: r => dur(r.listen_s) },
          { key: 'reach', name: 'הגיעו עד', num: 1, fmt: r => `<div class="progress" title="${Math.round(r.reach * 100)}%"><i style="width:${Math.round(r.reach * 100)}%"></i></div>${Math.round(r.reach * 100)}%` },
          { key: 'completed', name: 'הושלמו', num: 1, fmt: r => `${N(r.completed)} (${pct(r.completed, r.plays)})` },
          { key: 'duration_s', name: 'אורך', num: 1, fmt: r => dur(r.duration_s) },
          { key: 'download', name: 'הורדות', num: 1, fmt: r => N(r.download) },
          { key: 'pdf_open', name: 'סיכום', num: 1, fmt: r => N(r.pdf_open) },
          { key: 'share', name: 'שיתופים', num: 1, fmt: r => N(r.share) },
        ], items, { sort: 'plays' })}</div>
      <div class="card"><h3>לפי סדרה <span class="sub">מסכת / פרשה / מועד</span></h3>
        ${table('series', [
          { key: 'series', name: 'סדרה', fmt: r => `${esc(r.series || '—')} <span class="pill">${esc(KIND[r.kind] || '')}</span>` },
          { key: 'plays', name: 'השמעות', num: 1, fmt: r => N(r.plays) },
          { key: 'listeners', name: 'מאזינים', num: 1, fmt: r => N(r.listeners) },
          { key: 'items', name: 'שיעורים', num: 1, fmt: r => N(r.items) },
          { key: 'listen_s', name: 'זמן האזנה', num: 1, fmt: r => dur(r.listen_s) },
        ], DATA.series, { sort: 'listen_s' })}</div>
      <div class="card"><h3>עד כמה מקשיבים <span class="sub">התפלגות הנקודה הרחוקה שהגיעו אליה בשיעור</span></h3>
        ${hbars(reachRows, { limit: 11, sub: r => pct(r.n, l.plays) })}
        <p class="note">ממוצע האזנה להשמעה: ${dur(l.avg_listen)} · זמן אמיתי (בהתחשב במהירות): ${hours(l.wall_s)} שע׳</p></div>
      <div class="card w4"><h3>מהירות השמעה</h3>${hbars(DATA.speeds.map(r => ({ k: r.k + '×', n: r.n })), { sub: r => pct(r.n, l.plays) })}</div>
      <div class="card w4"><h3>איך הופעל השיעור</h3>${hbars(DATA.listenSrc.map(r => ({ k: LSRC[r.k] || r.k, n: r.n })), { sub: r => pct(r.n, l.plays) })}</div>
      <div class="card w4"><h3>פעולות על שיעורים</h3>${hbars(DATA.evTypes.filter(r => ['download', 'pdf_open', 'share', 'comments_open', 'text_open', 'sefaria_open', 'queue_add', 'favorite', 'speed_change', 'error'].includes(r.type)).sort((a, b) => b.n - a.n).map(r => ({ k: EVT[r.type] || r.type, n: r.n, u: r.u })), { sub: r => N(r.u) + ' אנשים' })}</div>
      <div class="card w12"><h3>הורדות, סיכומים ושיתופים לפי שיעור</h3>

          { key: 'download', name: 'הורדות', num: 1, fmt: r => N(r.download) },
          { key: 'pdf_open', name: 'פתיחת סיכום', num: 1, fmt: r => N(r.pdf_open) },
          { key: 'share', name: 'שיתופים', num: 1, fmt: r => N(r.share) },

          { key: 'text_open', name: 'פתיחת טקסט', num: 1, fmt: r => N(r.text_open) },
          { key: 'queue_add', name: 'לתור', num: 1, fmt: r => N(r.queue_add) },
          { key: 'favorite', name: 'מועדפים', num: 1, fmt: r => N(r.favorite) },
        ], actRows, { sort: 'download' })}</div>
    </div>`;
  }

  function vTimes() {
    const byHour = sumBy(DATA.heatS, 'hour'), byDow = sumBy(DATA.heatS, 'dow');

      <div class="card"><h3>כניסות לפי שעה</h3>${hbars(Array.from({ length: 24 }, (_, h) => ({ k: `${String(h).padStart(2, '0')}:00`, n: byHour[h] || 0 })), { limit: 24, sub: r => `${dur(lHour[parseInt(r.k)] || 0)} האזנה` })}</div>
      <div class="card"><h3>כניסות לפי יום בשבוע</h3>${hbars(DAYS.map((k, d) => ({ k, n: byDow[d] || 0 })), { limit: 7, sub: r => pct(r.n, s.sessions) })}

    </div>`;
  }

  function vAudience() {

    const freq = DATA.freq.map(r => ({ k: r.c >= 10 ? '10 ביקורים ומעלה' : r.c === 1 ? 'ביקור אחד' : `${r.c} ביקורים`, n: r.n, c: r.c })).sort((a, b) => a.c - b.c);

    return `<div class="grid">

      <div class="card w4"><h3>בכמה ימים שונים נכנסו</h3>${hbars(days, { limit: 15, sub: r => pct(r.n, s.visitors) })}</div>
      <div class="card w4"><h3>אפליקציה מול דפדפן</h3>${hbars(app, { sub: r => N(r.u) + ' מבקרים' })}
        <h3 style="margin-top:18px">מכשיר</h3>${hbars(DATA.devices.map(r => ({ ...r, k: DEVICE[r.k] || r.k })), { sub: r => N(r.u) + ' מבקרים' })}</div>
      <div class="card w4"><h3>מערכת הפעלה</h3>${hbars(DATA.os, { sub: r => N(r.u) + ' מבקרים' })}</div>
      <div class="card w4"><h3>דפדפן</h3>${hbars(DATA.browsers, { sub: r => N(r.u) + ' מבקרים' })}</div>
      <div class="card w4"><h3>שפת המכשיר</h3>${hbars(DATA.langs.map(r => ({ k: r.k || '—', n: r.n })))}</div>
      <div class="card"><h3>מדינות</h3>${hbars(DATA.countries.map(r => ({ ...r, k: country(r.k) })), { sub: r => N(r.u) + ' מבקרים', limit: 20 })}</div>
      <div class="card"><h3>ערים <span class="sub">לפי Cloudflare — משוער, לפי ספק האינטרנט</span></h3>${hbars(DATA.cities.map(r => ({ ...r, k: `${r.k} (${country(r.c)})` })), { sub: r => N(r.u) + ' מבקרים', limit: 25 })}</div>
      <div class="card w12"><h3>המאזינים הקבועים <span class="sub">מבקרים אנונימיים לפי זמן האזנה · לחיצה פותחת את כל ההיסטוריה</span></h3>
        ${table('visitors', [
          { key: 'visitor_id', name: 'מבקר', fmt: r => `<code>${esc(r.visitor_id.slice(0, 8))}</code>` },
          { key: 'sessions', name: 'ביקורים', num: 1, fmt: r => N(r.sessions) },
          { key: 'plays', name: 'השמעות', num: 1, fmt: r => N(r.plays) },
          { key: 'listen_s', name: 'זמן האזנה', num: 1, fmt: r => dur(r.listen_s) },
          { key: 'device', name: 'מכשיר', fmt: r => esc(`${DEVICE[r.device] || r.device || ''} · ${r.os || ''}`) },
          { key: 'city', name: 'עיר' },
          { key: 'last_seen', name: 'נראה לאחרונה', num: 1, fmt: r => ago(r.last_seen) },
        ], DATA.topVisitors, { sort: 'listen_s', click: 'visitor' })}</div>
    </div>`;
  }

  function vSources() {
    const s = DATA.kpiS[0] || {};
    return `<div class="grid">
      <div class="card"><h3>מקורות תנועה <span class="sub">מאיפה הגיעו לאתר</span></h3>${hbars(DATA.sources, { k: r => srcName(r.k), limit: 25, sub: r => `${N(r.u)} מבקרים · ${N(r.plays)} השמעות` })}
        <p class="note">טיפ: בקישורים שאתם שולחים אפשר להוסיף <code>?utm_source=whatsapp</code> או <code>?utm_source=mail</code> כדי לדעת בדיוק מאיפה הגיעו.</p></div>
      <div class="card"><h3>דפי כניסה <span class="sub">הדף הראשון בביקור</span></h3>${hbars(DATA.entries.map(r => ({ k: routeName(r.k), n: r.n })), { limit: 20, sub: r => pct(r.n, s.sessions) })}</div>
      <div class="card"><h3>הדפים הנצפים ביותר</h3>${hbars(DATA.pages.map(r => ({ ...r, k: routeName(r.k) })), { limit: 30, sub: r => N(r.u) + ' מבקרים' })}</div>
      <div class="card"><h3>מה חיפשו <span class="sub">מספר בסוגריים = תוצאות שהוצגו בממוצע</span></h3>${hbars(DATA.searches.map(r => ({ ...r, k: `${r.k} (${Math.round(r.results || 0)})` })), { limit: 40, sub: r => N(r.u) + ' אנשים' })}
        <p class="note">חיפושים עם 0 תוצאות מראים מה אנשים מחפשים ואין באתר.</p></div>
      ${DATA.campaigns.length ? `<div class="card"><h3>קמפיינים (utm_campaign)</h3>${hbars(DATA.campaigns, { sub: r => N(r.u) + ' מבקרים' })}</div>` : ''}
      <div class="card"><h3>כל סוגי האירועים</h3>${hbars(DATA.evTypes.map(r => ({ k: EVT[r.type] || r.type, n: r.n, u: r.u })).sort((a, b) => b.n - a.n), { limit: 30, sub: r => N(r.u) + ' אנשים' })}</div>
    </div>`;
  }

  let sessRows = [], sessOffset = 0;
  function vSessions() {
    return `<div class="grid"><div class="card w12"><h3>כל הביקורים <span class="sub">מהחדש לישן · לחיצה על שורה פותחת את מסלול הביקור המלא</span></h3>
      <div id="sessTable">${sessTable()}</div>
      <p style="text-align:center"><button class="btn" id="moreSess"${sessRows.length && sessRows.length % 200 === 0 ? '' : ' hidden'}>טעינת עוד</button></p></div></div>`;
  }
  function sessTable() {
    if (!sessRows.length) return '<div class="empty">טוען…</div>';
    return table('sessions', [
      { key: 'started_at', name: 'התחלה', num: 1, fmt: r => tFmt.format(r.started_at) },
      { key: 'duration_s', name: 'משך', num: 1, fmt: r => dur(r.duration_s) },
      { key: 'active_s', name: 'פעיל', num: 1, fmt: r => dur(r.active_s) },
      { key: 'pageviews', name: 'דפים', num: 1, fmt: r => N(r.pageviews) },
      { key: 'plays', name: 'השמעות', num: 1, fmt: r => N(r.plays) },
      { key: 'listen_s', name: 'האזנה', num: 1, fmt: r => dur(r.listen_s) },
      { key: 'device', name: 'מכשיר', fmt: r => esc(`${DEVICE[r.device] || r.device || ''} · ${r.os || ''} · ${r.browser || ''}`) + (r.standalone ? ' <span class="pill y">אפליקציה</span>' : '') },
      { key: 'city', name: 'מיקום', fmt: r => esc(`${r.city || ''}${r.city ? ', ' : ''}${country(r.country)}`) },
      { key: 'source', name: 'מקור', fmt: r => esc(srcName(r.source)) },
      { key: 'entry_route', name: 'כניסה', fmt: r => esc(routeName(r.entry_route)) },
      { key: 'is_new', name: '', fmt: r => r.is_new ? '<span class="pill g">חדש</span>' : '' },
    ], sessRows, { sort: 'started_at', click: 'session' });
  }
  async function loadSessions(reset) {
    if (reset) { sessRows = []; sessOffset = 0; }
    const d = await (await api(`/api/sessions?from=${range.from}&to=${range.to}&limit=200&offset=${sessOffset}`)).json();
    sessRows = sessRows.concat(d.rows); sessOffset += d.rows.length;
    if (tab === 'sessions') render();
  }

  function vExport() {
    const T = [
      ['sessions', 'ביקורים', 'שורה לכל ביקור: זמן התחלה וסיום, משך, זמן פעיל, דפים, השמעות, מכשיר, דפדפן, מיקום, מקור, דף כניסה ויציאה.'],
      ['listens', 'האזנות', 'שורה לכל השמעה של שיעור: איזה שיעור, מתי, כמה שניות נשמעו, מאיפה התחיל ועד איפה הגיע, מהירות, האם הושלם.'],
      ['events', 'אירועים', 'שורה לכל פעולה: צפייה בדף, הורדה, סיכום, שיתוף, חיפוש (כולל מה חיפשו), התקנה, תגובות ועוד.'],
      ['visitors', 'מבקרים', 'שורה לכל מבקר אנונימי שנכנס בטווח: מתי נראה לראשונה ולאחרונה, כמה ביקורים, כמה האזין, ומאיפה הגיע בפעם הראשונה.'],
    ];
    return `<div class="exports">${T.map(([k, n, d]) => `<div class="card"><h3>${n}</h3><p class="note">${d}</p><button class="btn primary" data-export="${k}">הורדת CSV (${range.from} – ${range.to})</button></div>`).join('')}</div>
      <div class="card w12" style="margin-top:14px"><h3>שימוש בנתונים</h3>
        <p class="note">הקבצים נפתחים ישירות ב-Excel / Google Sheets (עברית נתמכת). הזמנים בשעון ישראל. המזהים (visitor_id, session_id) מקשרים בין הטבלאות — אפשר לבנות טבלאות ציר (Pivot) לכל שאלה.
        <br>פרטיות: אין שמות, טלפונים או כתובות IP — רק מזהה אקראי לכל מכשיר.
        <br>כדי שהכניסות שלכם לא ייספרו: לפתוח בכל מכשיר פעם אחת את <code>https://vladomirsky.com/?no_track=1</code></p></div>`;
  }

  function render() {
    if (!DATA) return;
    hideTip();
    renderKpis();
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    const V = { overview: vOverview, lessons: vLessons, times: vTimes, audience: vAudience, sources: vSources, sessions: vSessions, export: vExport }[tab] || vOverview;
    $('#main').innerHTML = V();
    bindTables($('#main'));
    bindArea();
    $$('[data-metric]').forEach(b => b.addEventListener('click', () => { dailyMetric = b.dataset.metric; render(); }));
    $$('[data-export]').forEach(b => b.addEventListener('click', () => exportCsv(b.dataset.export, b)));
    $$('table[data-table=sessions] tr.click').forEach(tr => tr.addEventListener('click', () => openSession(sessRows[tr.dataset.row].session_id)));
    $$('table[data-table=visitors] tr.click').forEach(tr => tr.addEventListener('click', () => openVisitor(DATA.topVisitors[tr.dataset.row].visitor_id)));
    $('#moreSess')?.addEventListener('click', () => loadSessions(false));
    if (tab === 'sessions' && !sessRows.length && !loadSessions.busy) { loadSessions.busy = true; loadSessions(true).finally(() => { loadSessions.busy = false; }); }
  }

  async function exportCsv(table, btn) {
    const old = btn.textContent; btn.textContent = 'מכין קובץ…'; btn.disabled = true;
    try {
      const r = await api(`/api/export?table=${table}&from=${range.from}&to=${range.to}`);
      const blob = await r.blob(); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = `shiurim-${table}-${range.from}_${range.to}.csv`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (e) { alert('הייצוא נכשל: ' + e.message); }
    btn.textContent = old; btn.disabled = false;
  }

  // ---------- חלון פרטים ----------
  const dlg = $('#dlg');
  $('#dlgClose').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  function openDlg(title, html) { if (!AUTHED) return; $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = html; if (!dlg.open) dlg.showModal(); }

  function evText(e) {
    const t = EVT[e.type] || e.type;
    if (e.type === 'pageview') return `${t}: <b>${esc(routeName(e.route))}</b>`;
    if (e.type === 'search') return `${t}: <b>"${esc(e.label)}"</b> <span class="pill">${N(e.value)} תוצאות</span>`;
    if (e.type === 'outbound') return `${t}: ${esc(e.label)}`;
    if (e.type === 'speed_change') return `${t}: ${esc(e.value)}×`;
    return `${t}${e.title ? ': <b>' + esc(e.title) + '</b>' : ''}${e.type === 'error' ? ' ' + esc(e.label || '') : ''}`;
  }
  function listenText(l) {
    const reach = l.duration_s ? Math.round(l.max_pos_s / l.duration_s * 100) : 0;
    return `🎧 האזנה: <b>${esc(l.title || l.item_id)}</b> — ${dur(l.listened_s)} נשמעו, הגיע עד ${reach}%${l.completed ? ' <span class="pill g">הושלם</span>' : ''}${l.resumed ? ' <span class="pill">המשך מנקודה שמורה</span>' : ''}${l.speed !== 1 ? ` <span class="pill">${esc(l.speed)}×</span>` : ''} <span class="pill">${esc(LSRC[l.source] || l.source || '')}</span>`;
  }

  async function openSession(id) {
    openDlg('ביקור', '<div class="empty">טוען…</div>');
    const d = await (await api('/api/session?id=' + encodeURIComponent(id))).json();
    const s = d.session; if (!s) return openDlg('ביקור', '<div class="empty">לא נמצא</div>');
    const tl = [...d.events.map(e => ({ ts: e.ts, html: evText(e) })), ...d.listens.map(l => ({ ts: l.started_at, html: listenText(l) }))].sort((a, b) => a.ts - b.ts);
    openDlg(`ביקור · ${fullFmt.format(s.started_at)}`, `
      <div class="facts">
        <div><span>משך</span>${dur(s.duration_s)}</div><div><span>זמן פעיל על המסך</span>${dur(s.active_s)}</div>
        <div><span>האזנה</span>${dur(s.listen_s)} · ${N(s.plays)} השמעות</div><div><span>דפים</span>${N(s.pageviews)}</div>
        <div><span>מכשיר</span>${esc(`${DEVICE[s.device] || s.device} · ${s.os} · ${s.browser}`)}${s.standalone ? ' · אפליקציה' : ''}</div>
        <div><span>מסך / שפה / רשת</span>${esc(`${s.screen || ''} · ${s.lang || ''} · ${s.connection || ''}`)}</div>
        <div><span>מיקום</span>${esc(`${s.city || ''} ${s.region ? '(' + s.region + ')' : ''} ${country(s.country)}`)}</div>
        <div><span>מקור</span>${esc(srcName(s.source))}${s.referrer && s.referrer !== s.source ? ' · ' + esc(s.referrer) : ''}${s.campaign ? ' · ' + esc(s.campaign) : ''}</div>
        <div><span>מבקר</span><a href="#" data-visitor="${esc(s.visitor_id)}">${s.is_new ? 'ביקור ראשון · ' : ''}כל ההיסטוריה ←</a></div>
      </div>
      <h3>מה עשה בביקור</h3>
      <ul class="tl">${tl.map(x => `<li><time>${timeFmt.format(x.ts)}</time><span>${x.html}</span></li>`).join('') || '<li class="empty">אין אירועים</li>'}</ul>`);
    $('[data-visitor]', dlg)?.addEventListener('click', e => { e.preventDefault(); openVisitor(e.currentTarget.dataset.visitor); });
  }

  async function openVisitor(id) {
    openDlg('מבקר', '<div class="empty">טוען…</div>');
    const d = await (await api('/api/visitor?id=' + encodeURIComponent(id))).json();
    const v = d.visitor; if (!v) return openDlg('מבקר', '<div class="empty">לא נמצא</div>');
    const byItem = Object.create(null);
    for (const l of d.listens) { const o = (byItem[l.item_id] ||= { title: l.title || l.item_id, n: 0, s: 0, c: 0, last: 0 }); o.n++; o.s += l.listened_s; o.c += l.completed; o.last = Math.max(o.last, l.started_at); }
    const items = Object.values(byItem).sort((a, b) => b.last - a.last);
    openDlg(`מבקר ${id.slice(0, 8)}`, `
      <div class="facts">
        <div><span>נראה לראשונה</span>${fullFmt.format(v.first_seen)}</div><div><span>נראה לאחרונה</span>${fullFmt.format(v.last_seen)}</div>
        <div><span>ביקורים</span>${N(v.sessions)}</div><div><span>השמעות</span>${N(v.plays)}</div><div><span>זמן האזנה כולל</span>${dur(v.listen_s)}</div>
        <div><span>מכשיר</span>${esc(`${DEVICE[v.device] || v.device} · ${v.os} · ${v.browser}`)}</div>
        <div><span>מיקום</span>${esc(`${v.city || ''} ${country(v.country)}`)}</div><div><span>הגיע לראשונה מ</span>${esc(srcName(v.first_source))}</div>
      </div>
      <h3>שיעורים ששמע (${items.length})</h3>
      <table><thead><tr><th>שיעור</th><th>פעמים</th><th>זמן</th><th>הושלם</th><th>לאחרונה</th></tr></thead><tbody>
        ${items.map(i => `<tr><td>${esc(i.title)}</td><td class="num">${i.n}</td><td class="num">${dur(i.s)}</td><td class="num">${i.c ? '✓' : ''}</td><td class="num">${tFmt.format(i.last)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">לא האזין</td></tr>'}
      </tbody></table>
      <h3 style="margin-top:16px">ביקורים (${d.sessions.length})</h3>
      <table><tbody>${d.sessions.map(s => `<tr class="click" data-sid="${esc(s.session_id)}"><td class="num">${tFmt.format(s.started_at)}</td><td class="num">${dur(s.duration_s)}</td><td>${N(s.pageviews)} דפים · ${N(s.plays)} השמעות</td><td>${esc(srcName(s.source))}</td></tr>`).join('')}</tbody></table>
      <p style="margin-top:18px"><button class="btn danger" id="delVisitor">מחיקת כל הנתונים של המבקר הזה</button> <span class="note">למשל אם זה המכשיר שלך והכניסות שלך מעוותות את הנתונים</span></p>`);
    $$('[data-sid]', dlg).forEach(tr => tr.addEventListener('click', () => openSession(tr.dataset.sid)));
    $('#delVisitor').addEventListener('click', async () => {
      if (!confirm('למחוק לצמיתות את כל הביקורים, ההאזנות והאירועים של המבקר הזה?')) return;
      await api('/api/delete-visitor', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ visitor_id: id }) });
      dlg.close(); sessRows = []; load();
    });
  }

  // ---------- התחלה ----------
  let liveTimer = null, statsTimer = null;
  function start() {
    $('#login').hidden = true; $('#app').hidden = false;
    $('#from').value = range.from; $('#to').value = range.to;
    load(); loadLive();
    clearInterval(liveTimer); liveTimer = setInterval(() => { if (!document.hidden) loadLive(); }, 30e3);
    clearInterval(statsTimer); statsTimer = setInterval(() => { if (!document.hidden && range.to === todayIL() && !dlg.open) load(); }, 5 * 60e3);
  }
  const _load = load;
  load = async function () { sessRows = []; return _load(); };
  fetch('/api/ping', { credentials: 'same-origin' }).then(r => { if (r.ok) { AUTHED = true; start(); } else showLogin(); }).catch(() => showLogin());
})();
</script>
</body>
</html>
